name: Deploy to Contabo

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.github/workflows/ci.yml'
      - 'frontend/.env.example'
      - 'backend/.env.example'
      - 'backend/.dockerignore'
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy EnergyFlow
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on Contabo
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: ${{ secrets.CONTABO_DEPLOY_USER }}
          key: ${{ secrets.CONTABO_SSH_KEY }}
          port: ${{ secrets.CONTABO_SSH_PORT || 22 }}
          command_timeout: 20m
          script_stop: true
          script: |
            set -euo pipefail

            REPO_DIR="/home/ingenierohenry/energyflow"
            HEALTH_URL="https://energyflow.tachetech.com/api/v1/health"

            echo "==> [1/6] git sync"
            cd "$REPO_DIR"
            git fetch --prune origin
            git reset --hard origin/main
            echo "    HEAD: $(git rev-parse --short HEAD) - $(git log -1 --pretty=%s)"

            echo "==> [2/6] backend dependencies"
            cd "$REPO_DIR/backend"
            if [ ! -d .venv ]; then
              python3 -m venv .venv
            fi
            ./.venv/bin/pip install --upgrade pip --quiet
            ./.venv/bin/pip install -r requirements.txt --quiet

            echo "==> [3/6] frontend build"
            cd "$REPO_DIR/frontend"
            npm ci --no-audit --no-fund
            npm run build

            echo "==> [4/6] restart backend"
            sudo /bin/systemctl restart energyflow-backend.service
            sudo /bin/systemctl is-active --quiet energyflow-backend.service

            echo "==> [5/6] restart frontend"
            sudo /bin/systemctl restart energyflow-frontend.service
            sudo /bin/systemctl is-active --quiet energyflow-frontend.service

            echo "==> [6/6] smoke test"
            sleep 5
            for i in 1 2 3 4 5; do
              if curl -fsS --max-time 10 "$HEALTH_URL" > /tmp/health.out; then
                cat /tmp/health.out
                echo
                echo "==> deploy OK"
                exit 0
              fi
              echo "    health attempt $i failed, retrying..."
              sleep 3
            done
            echo "ERROR: health check failed after 5 attempts"
            sudo /bin/systemctl status energyflow-backend.service --no-pager || true
            exit 1
